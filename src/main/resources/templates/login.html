<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Logowanie')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" style="max-width:440px;">

    <div class="page-header">
        <h1>Zaloguj się</h1>
        <p class="lead">Wejdź do swojego konta gracza.</p>
    </div>

    <div class="alert alert-error" role="alert" th:if="${param.error}">
        Nieprawidłowy login lub hasło.
    </div>
    <div class="alert alert-success" role="status" th:if="${registered}">
        Konto zostało utworzone.
    </div>

    <form class="form-card" style="max-width:100%;" th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Login</label>
            <input type="text" id="username" name="username" required autofocus
                   autocomplete="username" placeholder="Twój login">
        </div>
        <div class="field">
            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" required
                   autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width:100%;margin-top:.5rem;">
            Zaloguj się
        </button>
        <p class="muted" style="margin-top:1.1rem;font-size:.85rem;text-align:center;">
            Nie masz konta? <a th:href="@{/register}">Zarejestruj się</a>
        </p>
    </form>

   
    

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
