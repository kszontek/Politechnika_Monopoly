<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Zarządzanie użytkownikami')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main">

    <div class="page-header">
        <h1>Zarządzanie użytkownikami</h1>
        <p class="lead">Dodawaj, edytuj, zmieniaj rangi i usuwaj graczy kampusu.</p>
    </div>

    <div th:if="${message}" class="alert alert-success">
        <i class="fa-solid fa-circle-check"></i> <span th:text="${message}">OK</span>
    </div>

    <div class="glass-panel" style="overflow:hidden;">
        <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;">
            <h2 style="font-size:1.15rem;margin:0;">Użytkownicy <span style="color:var(--tm);font-weight:600;">(<span th:text="${users.size()}">0</span>)</span></h2>
            <a th:href="@{/users/new}" class="btn"><i class="fa-solid fa-user-plus"></i> Dodaj użytkownika</a>
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Login</th>
                        <th>E-mail</th>
                        <th>Wiek</th>
                        <th>Rola</th>
                        <th>Poziom</th>
                        <th>ELO</th>
                        <th style="text-align:right;">Akcje</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td style="font-weight:700;" th:text="${u.username}">user</td>
                        <td style="color:var(--tm);" th:text="${u.email}">mail@pb.edu.pl</td>
                        <td th:text="${u.age}">20</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.role.name()=='ADMIN'?'badge-admin':(u.role.name()=='MODERATOR'?'badge-mod':'badge-dim')}"
                                  th:text="${u.role.displayName}">Użytkownik</span>
                        </td>
                        <td style="font-family:var(--font-display);font-weight:700;" th:text="${u.profile != null ? u.profile.level : '—'}">—</td>
                        <td style="font-family:var(--font-display);font-weight:700;color:var(--pb-green);" th:text="${u.profile != null ? u.profile.eloPoints : '—'}">—</td>
                        <td>
                            <div style="display:flex;gap:.4rem;justify-content:flex-end;flex-wrap:wrap;">
                                <a th:href="@{/users/{id}/edit(id=${u.id})}" class="btn btn-secondary btn-sm">
                                    <i class="fa-solid fa-pen"></i> Edytuj
                                </a>
                                <form th:action="@{/users/{id}/promote(id=${u.id})}" method="post" class="inline-form">
                                    <button type="submit" class="btn btn-sm" th:disabled="${u.role.name()=='ADMIN'}">
                                        <i class="fa-solid fa-arrow-up"></i> Awansuj
                                    </button>
                                </form>
                                <form th:action="@{/users/{id}/delete(id=${u.id})}" method="post" class="inline-form"
                                      onsubmit="return confirm('Na pewno usunąć tego użytkownika?');">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="fa-solid fa-trash"></i> Usuń
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${users.isEmpty()}">
                        <td colspan="7" class="muted" style="text-align:center;padding:2.5rem;">
                            Brak użytkowników. <a th:href="@{/users/new}">Dodaj pierwszego!</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
