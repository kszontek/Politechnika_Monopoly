<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Profil')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main">

    <div class="glass-panel" style="overflow:hidden;margin-bottom:1.5rem;">
        <div style="height:140px;background:linear-gradient(135deg,rgba(0,166,81,0.25),rgba(106,27,154,0.35));"></div>
        <div style="display:flex;align-items:flex-end;gap:1.5rem;padding:0 2rem 1.5rem;flex-wrap:wrap;">
            <div style="width:110px;height:110px;border-radius:24px;background:var(--gradient-primary);
                        border:5px solid #eef5f2;display:grid;place-items:center;margin-top:-55px;
                        font-family:var(--font-display);font-size:2.5rem;font-weight:800;color:#fff;
                        box-shadow:var(--glow-green);"
                 th:text="${#strings.toUpperCase(#strings.substring(user.username,0,1))}">P</div>
            <div style="flex:1;min-width:200px;">
                <h1 style="margin:0;" th:text="${user.username}">gracz</h1>
                <p style="margin:.2rem 0 0;color:var(--pb-purple);font-weight:700;font-size:.85rem;
                          text-transform:uppercase;letter-spacing:.06em;" th:text="${user.role.displayName}">Gracz</p>
            </div>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit" class="btn btn-secondary"><i class="fa-solid fa-arrow-right-from-bracket"></i> Wyloguj</button>
            </form>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr;gap:1.5rem;">

        <section th:if="${user.profile != null}" class="glass-panel" style="padding:1.75rem;">
            <p style="font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);margin:0 0 1.25rem;">
                Statystyki gracza
            </p>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;">
                <div style="background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);border-radius:14px;padding:1.4rem;text-align:center;">
                    <div style="font-family:var(--font-display);font-size:2.2rem;font-weight:800;line-height:1;" th:text="${user.profile.level}">1</div>
                    <div style="font-size:.72rem;color:var(--tm);margin-top:.4rem;text-transform:uppercase;letter-spacing:.05em;">Poziom</div>
                </div>
                <div style="background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);border-radius:14px;padding:1.4rem;text-align:center;">
                    <div style="font-family:var(--font-display);font-size:2.2rem;font-weight:800;line-height:1;color:var(--pb-green);" th:text="${user.profile.eloPoints}">1000</div>
                    <div style="font-size:.72rem;color:var(--tm);margin-top:.4rem;text-transform:uppercase;letter-spacing:.05em;">ELO</div>
                </div>
                <div style="background:rgba(255,255,255,0.6);border:1px solid var(--glass-border);border-radius:14px;padding:1.4rem;text-align:center;">
                    <div style="font-family:var(--font-display);font-size:2.2rem;font-weight:800;line-height:1;" th:text="${user.profile.gamesWon}">0</div>
                    <div style="font-size:.72rem;color:var(--tm);margin-top:.4rem;text-transform:uppercase;letter-spacing:.05em;">Wygrane</div>
                </div>
            </div>
        </section>

        <section class="glass-panel" style="padding:1.75rem;">
            <p style="font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);margin:0 0 1.25rem;">
                Dane konta
            </p>
            <div style="display:flex;flex-direction:column;gap:.6rem;">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:rgba(255,255,255,0.6);border-radius:10px;">
                    <span style="color:var(--tm);font-size:.85rem;">Login</span>
                    <strong th:text="${user.username}">login</strong>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:rgba(255,255,255,0.6);border-radius:10px;">
                    <span style="color:var(--tm);font-size:.85rem;">E-mail</span>
                    <span th:text="${user.email}">email</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:rgba(255,255,255,0.6);border-radius:10px;">
                    <span style="color:var(--tm);font-size:.85rem;">Wiek</span>
                    <span th:text="${user.age}">18</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:rgba(255,255,255,0.6);border-radius:10px;">
                    <span style="color:var(--tm);font-size:.85rem;">Rola</span>
                    <span class="badge"
                          th:classappend="${user.role.name()=='ADMIN'?'badge-admin':(user.role.name()=='MODERATOR'?'badge-mod':'badge-dim')}"
                          th:text="${user.role.displayName}">Użytkownik</span>
                </div>
            </div>
        </section>

        <section sec:authorize="hasRole('ADMIN')" class="glass-panel"
                 style="padding:1.75rem;background:linear-gradient(135deg,rgba(0,166,81,0.08),rgba(106,27,154,0.08));">
            <p style="font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pb-purple);margin:0 0 .6rem;">
                Panel administratora
            </p>
            <p style="font-size:.9rem;color:var(--tm);margin:0 0 1.2rem;">
                Zarządzaj użytkownikami — dodawaj, edytuj, usuwaj i zmieniaj rangi graczy.
            </p>
            <a th:href="@{/users}" class="btn">
                <i class="fa-solid fa-users-gear"></i> Zarządzaj użytkownikami
            </a>
        </section>

    </div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
