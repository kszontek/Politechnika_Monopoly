<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formularz użytkownika')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" style="max-width:560px;">

    <div class="page-header">
        <h1 th:text="${user.id == null} ? 'Dodaj użytkownika' : 'Edytuj użytkownika'">Dodaj użytkownika</h1>
        <p class="lead" th:text="${user.id == null} ? 'Utwórz nowe konto gracza.' : 'Zmień rolę lub wiek użytkownika.'">Uzupełnij dane.</p>
    </div>

    <form class="form-card" th:action="@{/users/save}" method="post" th:object="${user}" novalidate>
        <input type="hidden" name="id" th:value="*{id}" />

        <div class="field">
            <label for="username">Login</label>
            <input type="text" id="username" th:field="*{username}" th:disabled="${user.id != null}" placeholder="login gracza">
            <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}" th:disabled="${user.id != null}" placeholder="adres@pb.edu.pl">
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field" th:if="${user.id == null}">
            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" placeholder="min. 5 znaków">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="field">
            <label for="age">Wiek</label>
            <input type="number" id="age" th:field="*{age}" min="18" max="120" placeholder="np. 21">
            <p class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p>
        </div>

        <div class="field">
            <label for="role">Rola / ranga</label>
            <select id="role" th:field="*{role}">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.displayName}">Rola</option>
            </select>
        </div>

        <div style="display:flex;gap:.75rem;margin-top:.5rem;">
            <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Zapisz</button>
            <a th:href="@{/users}" class="btn btn-secondary">Anuluj</a>
        </div>
    </form>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
