<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rejestracja')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main" style="max-width:440px;">

    <div class="page-header">
        <h1>Nowe konto</h1>
        <p class="lead">Pola oznaczone * są wymagane.</p>
    </div>

    <form class="form-card" style="max-width:100%;"
          th:action="@{/register}" th:object="${form}" method="post" novalidate>

        <div class="field">
            <label for="username">Login *</label>
            <input type="text" id="username" th:field="*{username}"
                   th:attr="aria-invalid=${#fields.hasErrors('username')} ? 'true' : 'false'"
                   autocomplete="username" placeholder="3–20 znaków, małe litery i cyfry">
            <p class="error" role="alert" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div class="field">
            <label for="email">E-mail *</label>
            <input type="email" id="email" th:field="*{email}"
                   th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : 'false'"
                   autocomplete="email" placeholder="adres@email.pl">
            <p class="error" role="alert" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="age">Wiek *</label>
            <input type="number" id="age" th:field="*{age}" min="18" max="120"
                   th:attr="aria-invalid=${#fields.hasErrors('age')} ? 'true' : 'false'"
                   placeholder="min. 18">
            <p class="error" role="alert" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p>
        </div>

        <div class="field">
            <label for="password">Hasło *</label>
            <input type="password" id="password" th:field="*{password}"
                   th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : 'false'"
                   autocomplete="new-password" placeholder="Min. 5 znaków">
            <p class="error" role="alert" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="field">
            <label for="confirmPassword">Powtórz hasło *</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                   th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')} ? 'true' : 'false'"
                   autocomplete="new-password" placeholder="Wpisz hasło ponownie">
            <p class="error" role="alert" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
        </div>

        <button type="submit" class="btn" style="width:100%;margin-top:.5rem;">
            Zarejestruj konto
        </button>
        <p class="muted" style="margin-top:1.1rem;font-size:.85rem;text-align:center;">
            Masz już konto? <a th:href="@{/login}">Zaloguj się</a>
        </p>
    </form>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
