<!DOCTYPE html>
<html lang="pl"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Strona glowna')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main id="main">
    <div class="page-header">
        <h1>Politechnika Monopoly</h1>
        <p class="lead">Satyryczna gra planszowa osadzona na kampusie PB.</p>
    </div>
    <div class="form-card" style="max-width:520px;">
        <p>Dolacz do gry albo zaloguj sie na swoje konto.</p>
        <div style="display:flex;gap:.75rem;margin-top:1rem;">
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn">Zaloguj</a>
            <span sec:authorize="isAuthenticated()">Jestes zalogowany.</span>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
